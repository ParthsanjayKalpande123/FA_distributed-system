# CampusWatch — Docker Compose
# Spins up 3 Raft backend nodes, Redis, and the Next.js frontend.

services:
  # ── Raft Backend Nodes ──────────────────────────────────────────
  node-a:
    build: ./backend
    container_name: campuswatch-node-a
    environment:
      NODE_ID: node-a
      PORT: "3001"
      PEERS: "node-b:3002,node-c:3003"
      REDIS_URL: "redis://redis:6379"
      AWS_LAMBDA_URL: "${AWS_LAMBDA_URL:-}"
    ports:
      - "3001:3001"
    depends_on:
      - redis
    restart: "no"
    networks:
      - campuswatch

  node-b:
    build: ./backend
    container_name: campuswatch-node-b
    environment:
      NODE_ID: node-b
      PORT: "3002"
      PEERS: "node-a:3001,node-c:3003"
      REDIS_URL: "redis://redis:6379"
      AWS_LAMBDA_URL: "${AWS_LAMBDA_URL:-}"
    ports:
      - "3002:3002"
    depends_on:
      - redis
    restart: "no"
    networks:
      - campuswatch

  node-c:
    build: ./backend
    container_name: campuswatch-node-c
    environment:
      NODE_ID: node-c
      PORT: "3003"
      PEERS: "node-a:3001,node-b:3002"
      REDIS_URL: "redis://redis:6379"
      AWS_LAMBDA_URL: "${AWS_LAMBDA_URL:-}"
    ports:
      - "3003:3003"
    depends_on:
      - redis
    restart: "no"
    networks:
      - campuswatch

  # ── Redis (Pub/Sub message bus) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: campuswatch-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - campuswatch

  # ── Next.js Frontend ────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: campuswatch-frontend
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - node-a
      - node-b
      - node-c
    restart: unless-stopped
    networks:
      - campuswatch

networks:
  campuswatch:
    driver: bridge
